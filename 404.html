<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Found — Backstage Live</title>
    <link rel="canonical" href="https://backstagelive.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --ink: hsl(25, 18%, 14%);
        --muted: hsl(25, 10%, 42%);
        --line: hsl(30, 18%, 88%);
        --bg: #FCFBF7;
        --accent: hsl(14, 80%, 55%);
        --green: hsl(150, 31%, 18%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
        padding: 80px 24px 80px;
        text-align: center;
      }
      .brand-mark {
        width: 56px;
        height: 56px;
        background: var(--green);
        border-radius: 14px;
        display: inline-grid;
        place-items: center;
        margin-bottom: 24px;
      }
      .brand-mark svg { width: 36px; height: 36px; }
      h1 {
        font-size: 40px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        font-size: 16px;
        margin: 0 0 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .actions a {
        display: inline-block;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .secondary {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="brand-mark">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M 32 94 L 32 58 A 28 28 0 0 1 88 58 L 88 94 Z" fill="#FCFBF7"/>
          <circle cx="60" cy="66" r="5" fill="#C66B3D"/>
        </svg>
      </div>
      <h1>Page not found</h1>
      <p>
        The page you were looking for doesn't exist, or has moved.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="secondary" href="/support">Support</a>
      </div>
    </div>
  </body>
</html>
